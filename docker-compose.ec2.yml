services:
  web:
    build: .
    container_name: coachspace
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.ec2}
      DATABASE_URL: ${DATABASE_URL:-/app/data/coaching.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - coachspace-data:/app/data
      - coachspace-uploads:/app/uploads

volumes:
  coachspace-data:
  coachspace-uploads:
